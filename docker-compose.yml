name: drift-triage-copilot

services:
  platform:
    build: ./platform
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      AGENT_BASE_URL: http://agent:8001
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./platform/data:/app/data
    depends_on:
      - mlflow
    networks:
      - drift-net

  agent:
    build: ./agent
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      POSTGRES_DSN: postgresql://user:pass@postgres:5432/drift
      REDIS_URL: redis://redis:6379/0
      PLATFORM_BASE_URL: http://platform:8000
    depends_on:
      - postgres
      - redis
    networks:
      - drift-net

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    env_file: .env
    volumes:
      - ./platform/data:/app/data
    depends_on:
      - platform
      - redis
      - mlflow
    networks:
      - drift-net

  dashboard:
    build: ./dashboard
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      AGENT_BASE_URL: http://agent:8001
      PLATFORM_BASE_URL: http://platform:8000
    depends_on:
      - platform
      - agent
      - postgres
      - redis
    networks:
      - drift-net

  mlflow:
    build: ./mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./platform/data:/data
    networks:
      - drift-net

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: drift
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - drift-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - drift-net

volumes:
  pgdata:
  redisdata:

networks:
  drift-net:
    driver: bridge
