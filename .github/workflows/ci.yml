name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: pip install uv

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Copy dataset for compute_sha256 test
        run: mkdir -p platform/data && cp initial-training/dataset/bank-additional-full.csv platform/data/

      - name: Build images
        run: docker compose build

      - name: Run platform tests
        run: |
          cd platform && uv sync && uv run pytest tests/ -v --ignore=tests/test_predict_api.py

      - name: Run agent tests
        run: |
          cd agent && uv sync && PYTHONPATH=.. uv run pytest tests/ -v
