name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      - name: Run platform tests
        run: |
          cd platform && pip install uv && uv sync && uv run pytest tests/ -v
        env:
          MLFLOW_TRACKING_URI: http://localhost:5000

      - name: Run agent trajectory tests
        run: |
          cd agent && pip install uv && uv sync && uv run pytest tests/ -v
